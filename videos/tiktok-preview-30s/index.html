<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      :root {
        --bg: #17121c;
        --bg-deep: #0d0a12;
        --ink: #1a1623;
        --ground: #2b241e;
        --ground-hi: #5a4432;
        --skin-player: #f1d9b0;
        --skin-enemy: #d9b48a;
        --steel: #9a8f6a;
        --red: #8a1a1a;
        --red-hot: #e63946;
        --paper: #f3e9d2;
        --paper-dim: #c9bfa8;
      }
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      html,
      body {
        margin: 0;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
        background: var(--bg);
        font-family: "Inter", ui-sans-serif, system-ui, sans-serif;
        color: var(--paper);
      }
      #root {
        position: relative;
        width: 1080px;
        height: 1920px;
        overflow: hidden;
      }
      .clip {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-fqnc" id="root" data-composition-id="root" data-width="1080" data-height="1920" data-duration="30">
      <div data-hf-id="hf-hxs0" id="scene-hook" class="clip" data-composition-id="f1" data-composition-src="compositions/frames/01-hook.html" data-start="0" data-duration="3" data-track-index="0"></div>
      <div data-hf-id="hf-npym" id="scene-setup" class="clip" data-composition-id="f2" data-composition-src="compositions/frames/02-setup.html" data-start="3" data-duration="4" data-track-index="0"></div>
      <div data-hf-id="hf-i4di" id="scene-combat-a" class="clip" data-composition-id="f3" data-composition-src="compositions/frames/03-combat-a.html" data-start="7" data-duration="6" data-track-index="0"></div>
      <div data-hf-id="hf-6h94" id="scene-combat-b" class="clip" data-composition-id="f4" data-composition-src="compositions/frames/04-combat-b.html" data-start="13" data-duration="7" data-track-index="0"></div>
      <div data-hf-id="hf-ocdl" id="scene-climax" class="clip" data-composition-id="f5" data-composition-src="compositions/frames/05-climax.html" data-start="20" data-duration="6" data-track-index="0"></div>
      <div data-hf-id="hf-47q5" id="scene-cta" class="clip" data-composition-id="f6" data-composition-src="compositions/frames/06-cta.html" data-start="26" data-duration="4" data-track-index="0"></div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      window.__timelines["root"] = gsap.timeline({ paused: true });
      window.__timelines["root"].seek(0);
    </script>
  </body>
</html>
