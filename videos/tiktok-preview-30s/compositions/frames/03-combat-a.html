<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <link rel="stylesheet" href="assets/scene.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .shake-root {
        position: absolute;
        inset: 0;
        will-change: transform;
      }
      .fighter {
        position: absolute;
        bottom: 380px;
        width: 360px;
        height: 540px;
        will-change: transform, opacity;
      }
      .player {
        left: 220px;
      }
      .enemy {
        left: 500px;
        transform: scaleX(-1);
      }
      .slash-svg {
        position: absolute;
        left: 200px;
        top: 1100px;
        width: 680px;
        height: 320px;
        pointer-events: none;
        will-change: transform, opacity;
      }
      .slash-svg path {
        fill: none;
        stroke: var(--paper);
        stroke-width: 14;
        stroke-linecap: round;
      }
      .flash {
        position: absolute;
        left: 50%;
        top: 1180px;
        width: 400px;
        height: 400px;
        margin-left: -200px;
        border-radius: 999px;
        background: radial-gradient(
          circle,
          var(--red-hot) 0%,
          rgba(230, 57, 70, 0.6) 25%,
          transparent 65%
        );
        opacity: 0;
        will-change: transform, opacity;
      }
      .label {
        position: absolute;
        top: 220px;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 44px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--paper-dim);
        opacity: 0;
        will-change: opacity;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-yaal" id="root" data-composition-id="combat-a" data-width="1080" data-height="1920" data-duration="6">
      <div data-hf-id="hf-q7bi" class="vignette"></div>
      <div data-hf-id="hf-hnpv" class="ground-band"></div>
      <div data-hf-id="hf-qs0e" class="label">— ONE CUT —</div>
      <div data-hf-id="hf-gmlf" class="shake-root">
        <div data-hf-id="hf-z6b2" class="fighter player">
          <img data-hf-id="hf-f4p3" src="assets/samurai.svg" alt="" aria-hidden="true" style="width: 100%; height: 100%">
        </div>
        <div data-hf-id="hf-reaa" class="fighter enemy" data-layout-allow-overflow="">
          <img data-hf-id="hf-7rvd" src="assets/enemy.svg" alt="" aria-hidden="true" style="width: 100%; height: 100%">
        </div>
        <svg data-hf-id="hf-xbtr" class="slash-svg" viewBox="0 0 680 320">
          <path data-hf-id="hf-4a68" id="slash-path-a" d="M 40 260 Q 340 20 640 220" />
        </svg>
        <div data-hf-id="hf-xwk6" class="flash"></div>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const path = document.getElementById("slash-path-a");
      const slashLen = path.getTotalLength();
      path.setAttribute("stroke-dasharray", slashLen);
      path.setAttribute("stroke-dashoffset", slashLen);

      tl.fromTo(
        ".enemy",
        { x: 500, opacity: 0 },
        { x: 0, opacity: 1, duration: 0.45, ease: "power3.out" },
        0.1
      );
      tl.to(".enemy", { x: -30, duration: 0.15, ease: "power2.out" }, 0.55);

      tl.fromTo(
        ".player",
        { x: -40 },
        { x: 90, duration: 0.3, ease: "expo.out" },
        0.75
      );

      tl.fromTo(
        "#slash-path-a",
        { attr: { "stroke-dashoffset": slashLen } },
        {
          attr: { "stroke-dashoffset": 0 },
          duration: 0.18,
          ease: "power3.in",
        },
        1.0
      );
      tl.to(
        "#slash-path-a",
        { attr: { "stroke-dashoffset": -slashLen }, duration: 0.22, ease: "power3.out" },
        1.2
      );

      tl.fromTo(
        ".flash",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1.2, duration: 0.08, ease: "expo.out", overwrite: "auto" },
        1.08
      );
      tl.to(
        ".flash",
        { opacity: 0, scale: 1.6, duration: 0.22, ease: "power2.out", overwrite: "auto" },
        1.18
      );

      tl.to(
        ".enemy",
        {
          x: 820,
          y: -80,
          rotation: 25,
          opacity: 0,
          duration: 0.55,
          ease: "power2.out",
        },
        1.1
      );

      tl.to(
        ".shake-root",
        {
          keyframes: [
            { x: 0, y: 0, duration: 0 },
            { x: 12, y: -8, duration: 0.04 },
            { x: -10, y: 6, duration: 0.04 },
            { x: 7, y: -4, duration: 0.04 },
            { x: -4, y: 2, duration: 0.04 },
            { x: 0, y: 0, duration: 0.04 },
          ],
          ease: "none",
        },
        1.08
      );

      tl.fromTo(
        ".label",
        { opacity: 0 },
        { opacity: 1, duration: 0.4, ease: "power2.out" },
        1.8
      );
      tl.to(".label", { opacity: 0, duration: 0.5, ease: "power2.in" }, 5.0);

      tl.to(
        ".player",
        { x: 0, duration: 0.6, ease: "power3.out" },
        1.8
      );

      window.__timelines["combat-a"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
