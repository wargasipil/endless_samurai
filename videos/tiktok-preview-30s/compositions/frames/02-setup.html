<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <link rel="stylesheet" href="assets/scene.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .setup-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 380px;
        text-align: center;
      }
      .setup-stack h2 {
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        font-size: 180px;
        letter-spacing: 0.01em;
        color: var(--paper);
        line-height: 1.0;
        margin: 0;
        opacity: 0;
        will-change: transform, opacity;
      }
      .setup-stack h2:nth-child(2) {
        color: var(--paper-dim);
      }
      .setup-stack h2:nth-child(3) {
        color: var(--red-hot);
      }
      .hero-samurai {
        left: 50%;
        transform: translateX(-50%);
      }
      .samurai-breathe {
        transform-origin: 50% 100%;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-gz52" id="root" data-composition-id="setup" data-width="1080" data-height="1920" data-duration="4">
      <div data-hf-id="hf-q7bi" class="vignette"></div>
      <div data-hf-id="hf-hnpv" class="ground-band"></div>
      <div data-hf-id="hf-fssf" class="samurai-breathe hero-samurai">
        <img data-hf-id="hf-tctx" src="assets/samurai.svg" alt="" aria-hidden="true" style="width: 360px; height: 540px">
      </div>
      <div data-hf-id="hf-m57q" class="setup-stack" data-layout-allow-overlap="">
        <h2 data-hf-id="hf-qgsb" class="setup-line" data-layout-allow-overlap="">ENDLESS.</h2>
        <h2 data-hf-id="hf-vbtb" class="setup-line" data-layout-allow-overlap="">MOBILE.</h2>
        <h2 data-hf-id="hf-9o95" class="setup-line" data-layout-allow-overlap="">BRUTAL.</h2>
      </div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const lines = gsap.utils.toArray(".setup-line");
      lines.forEach((line, i) => {
        tl.fromTo(
          line,
          { opacity: 0, y: 220 },
          { opacity: 1, y: 0, duration: 0.42, ease: "expo.out" },
          0.12 + i * 0.18
        );
      });

      tl.fromTo(
        ".samurai-breathe",
        { scaleY: 1.0 },
        {
          scaleY: 0.97,
          duration: 1.1,
          ease: "sine.inOut",
          repeat: 2,
          yoyo: true,
        },
        0
      );

      window.__timelines["setup"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
