<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <link rel="stylesheet" href="assets/scene.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .hook-line {
        position: absolute;
        left: 0;
        right: 0;
        text-align: center;
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        color: var(--paper);
        letter-spacing: 0.02em;
        line-height: 0.9;
        opacity: 0;
        will-change: transform, opacity;
      }
      .hook-face {
        top: 300px;
        font-size: 200px;
      }
      .hook-the {
        top: 500px;
        font-size: 110px;
      }
      .hook-blade {
        top: 620px;
        font-size: 240px;
      }
      .hero-samurai {
        left: 50%;
        transform: translateX(-50%) scale(0);
        opacity: 0;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-uzqn" id="root" data-composition-id="hook" data-width="1080" data-height="1920" data-duration="3">
      <div data-hf-id="hf-q7bi" class="vignette"></div>
      <div data-hf-id="hf-hnpv" class="ground-band"></div>
      <img data-hf-id="hf-7gdb" class="hero-samurai" src="assets/samurai.svg" alt="" aria-hidden="true">
      <div data-hf-id="hf-3w54" class="hook-line hook-face" data-layout-allow-overlap="">FACE</div>
      <div data-hf-id="hf-tbju" class="hook-line hook-the" data-layout-allow-overlap="">— THE —</div>
      <div data-hf-id="hf-qfye" class="hook-line hook-blade" data-layout-allow-overlap="">BLADE.</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        ".hero-samurai",
        { scale: 0, opacity: 0, transformOrigin: "50% 100%" },
        { scale: 1, opacity: 1, duration: 0.45, ease: "back.out(2.2)" },
        0.1
      );

      tl.fromTo(
        ".hook-face",
        { opacity: 0, scale: 1.3, y: -40 },
        { opacity: 1, scale: 1, y: 0, duration: 0.28, ease: "expo.out" },
        0.35
      );

      tl.fromTo(
        ".hook-the",
        { opacity: 0, x: -200 },
        { opacity: 1, x: 0, duration: 0.26, ease: "expo.out" },
        0.65
      );

      tl.fromTo(
        ".hook-blade",
        { opacity: 0, scale: 1.5 },
        { opacity: 1, scale: 1, duration: 0.38, ease: "back.out(2.6)" },
        0.95
      );

      tl.to(
        "#root",
        {
          keyframes: [
            { x: 0, y: 0, duration: 0 },
            { x: 6, y: -4, duration: 0.04 },
            { x: -5, y: 3, duration: 0.04 },
            { x: 4, y: -2, duration: 0.04 },
            { x: 0, y: 0, duration: 0.06 },
          ],
          ease: "none",
        },
        1.0
      );

      window.__timelines["hook"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
