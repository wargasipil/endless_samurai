<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <link rel="stylesheet" href="assets/scene.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .glow {
        position: absolute;
        left: 50%;
        top: 760px;
        width: 1200px;
        height: 1200px;
        margin-left: -600px;
        margin-top: -600px;
        border-radius: 999px;
        background: radial-gradient(
          circle,
          rgba(230, 57, 70, 0.55) 0%,
          rgba(230, 57, 70, 0.25) 25%,
          rgba(230, 57, 70, 0.08) 50%,
          transparent 72%
        );
        opacity: 0;
        will-change: transform, opacity;
        pointer-events: none;
      }
      .stat-stack {
        position: absolute;
        left: 0;
        right: 0;
        top: 420px;
        text-align: center;
      }
      .stat-num {
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        font-size: 420px;
        line-height: 0.9;
        color: var(--paper);
        letter-spacing: -0.02em;
        will-change: transform, opacity;
      }
      .stat-label {
        margin-top: 20px;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 56px;
        letter-spacing: 0.3em;
        text-transform: uppercase;
        color: var(--paper-dim);
        opacity: 0;
        will-change: opacity, transform;
      }
      .vs-line {
        position: absolute;
        left: 0;
        right: 0;
        top: 1680px;
        text-align: center;
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        font-size: 90px;
        color: var(--red-hot);
        letter-spacing: 0.04em;
        opacity: 0;
        will-change: opacity, transform;
      }
      .hero-samurai {
        left: 50%;
        margin-left: -140px;
        bottom: 420px;
        width: 280px;
        height: 420px;
        transform-origin: 50% 100%;
        will-change: transform;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-x0jv" id="root" data-composition-id="climax" data-width="1080" data-height="1920" data-duration="6">
      <div data-hf-id="hf-q7bi" class="vignette"></div>
      <div data-hf-id="hf-hnpv" class="ground-band"></div>
      <div data-hf-id="hf-5mei" class="glow" data-layout-allow-overflow=""></div>
      <div data-hf-id="hf-4a45" class="stat-stack" data-layout-allow-overlap="">
        <div data-hf-id="hf-tou2" class="stat-num" data-count="0" data-layout-allow-overlap="">0</div>
        <div data-hf-id="hf-irkp" class="stat-label" data-layout-allow-overlap="">ENEMIES.</div>
      </div>
      <div data-hf-id="hf-fdg1" class="hero-samurai">
        <img data-hf-id="hf-f4p3" src="assets/samurai.svg" alt="" aria-hidden="true" style="width: 100%; height: 100%">
      </div>
      <div data-hf-id="hf-t0t5" class="vs-line">ONE SWORD.</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      const numEl = document.querySelector(".stat-num");
      const proxy = { v: 3 };

      tl.fromTo(
        ".glow",
        { opacity: 0, scale: 0.4 },
        { opacity: 1, scale: 1, duration: 1.2, ease: "power2.out" },
        0
      );
      tl.to(
        ".glow",
        {
          opacity: 0.85,
          scale: 1.05,
          duration: 1.4,
          ease: "sine.inOut",
          yoyo: true,
          repeat: 1,
        },
        1.2
      );

      tl.fromTo(
        ".stat-num",
        { opacity: 0, scale: 0.6, y: 60 },
        { opacity: 1, scale: 1, y: 0, duration: 0.5, ease: "back.out(2.0)" },
        0.1
      );

      tl.to(
        proxy,
        {
          v: 100,
          duration: 1.1,
          ease: "power3.out",
          onUpdate: () => {
            numEl.textContent = Math.round(proxy.v) + (proxy.v >= 99.5 ? "+" : "");
          },
        },
        0.3
      );

      tl.fromTo(
        ".stat-label",
        { opacity: 0, y: 40 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
        1.1
      );

      tl.fromTo(
        ".hero-samurai",
        { scale: 0, opacity: 0 },
        { scale: 1, opacity: 1, duration: 0.55, ease: "back.out(2.0)" },
        0.6
      );
      tl.to(
        ".hero-samurai",
        {
          scaleY: 0.97,
          duration: 1.1,
          ease: "sine.inOut",
          repeat: 2,
          yoyo: true,
        },
        1.3
      );

      tl.fromTo(
        ".vs-line",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.5, ease: "expo.out" },
        1.8
      );

      window.__timelines["climax"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
