<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=1080, height=1920">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin="">
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@700&family=Noto+Serif+JP:wght@900&display=swap">
    <link rel="stylesheet" href="assets/scene.css">
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      .cta-glow {
        position: absolute;
        left: 50%;
        top: 740px;
        width: 900px;
        height: 900px;
        margin-left: -450px;
        margin-top: -450px;
        border-radius: 999px;
        background: radial-gradient(
          circle,
          rgba(241, 217, 176, 0.4) 0%,
          rgba(241, 217, 176, 0.15) 30%,
          transparent 60%
        );
        opacity: 0;
        will-change: transform, opacity;
      }
      .icon-wrap {
        position: absolute;
        left: 50%;
        top: 500px;
        width: 480px;
        height: 480px;
        margin-left: -240px;
        will-change: transform, opacity;
      }
      .icon-wrap img {
        width: 100%;
        height: 100%;
        object-fit: contain;
        border-radius: 96px;
      }
      .wordmark {
        position: absolute;
        left: 0;
        right: 0;
        top: 1080px;
        text-align: center;
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        font-size: 180px;
        letter-spacing: 0.08em;
        color: var(--paper);
        line-height: 1;
      }
      .wordmark span {
        display: inline-block;
        opacity: 0;
        will-change: transform, opacity;
      }
      .cta-sub {
        position: absolute;
        left: 0;
        right: 0;
        top: 1340px;
        text-align: center;
        font-family: "Inter", sans-serif;
        font-weight: 700;
        font-size: 54px;
        letter-spacing: 0.28em;
        text-transform: uppercase;
        color: var(--paper-dim);
        opacity: 0;
        will-change: opacity, transform;
      }
      .cta-main {
        position: absolute;
        left: 0;
        right: 0;
        top: 1480px;
        text-align: center;
        font-family: "Noto Serif JP", serif;
        font-weight: 900;
        font-size: 120px;
        letter-spacing: 0.04em;
        color: var(--red-hot);
        opacity: 0;
        will-change: transform, opacity;
      }
    </style>
  </head>
  <body>
    <div data-hf-id="hf-9s7d" id="root" data-composition-id="cta" data-width="1080" data-height="1920" data-duration="4">
      <div data-hf-id="hf-q7bi" class="vignette"></div>
      <div data-hf-id="hf-7a9w" class="cta-glow"></div>
      <div data-hf-id="hf-bqrs" class="icon-wrap">
        <img data-hf-id="hf-3ssg" src="assets/icon.svg" alt="" aria-hidden="true">
      </div>
      <div data-hf-id="hf-cb03" class="wordmark">
        <span data-hf-id="hf-fmnq">S</span><span data-hf-id="hf-ms68">A</span><span data-hf-id="hf-i0hw">M</span><span data-hf-id="hf-eu1o">U</span><span data-hf-id="hf-f8cp">R</span><span data-hf-id="hf-r7dk">A</span><span data-hf-id="hf-jlq0">I</span>
      </div>
      <div data-hf-id="hf-mova" class="cta-sub">SOON ON ANDROID</div>
      <div data-hf-id="hf-yl6m" class="cta-main">PLAY FREE.</div>
    </div>
    <script>
      window.__timelines = window.__timelines || {};
      const tl = gsap.timeline({ paused: true });

      tl.fromTo(
        ".cta-glow",
        { opacity: 0, scale: 0.5 },
        { opacity: 1, scale: 1, duration: 0.9, ease: "power2.out" },
        0
      );

      tl.fromTo(
        ".icon-wrap",
        { scale: 0, opacity: 0, rotation: -8 },
        {
          scale: 1,
          opacity: 1,
          rotation: 0,
          duration: 0.6,
          ease: "back.out(2.2)",
        },
        0.1
      );

      const letters = gsap.utils.toArray(".wordmark span");
      letters.forEach((l, i) => {
        tl.fromTo(
          l,
          { opacity: 0, y: 120 },
          { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
          0.55 + i * 0.05
        );
      });

      tl.fromTo(
        ".cta-sub",
        { opacity: 0, y: 30 },
        { opacity: 1, y: 0, duration: 0.4, ease: "expo.out" },
        1.2
      );

      tl.fromTo(
        ".cta-main",
        { opacity: 0, scale: 1.3 },
        { opacity: 1, scale: 1, duration: 0.45, ease: "back.out(2.4)" },
        1.5
      );

      tl.to(
        ".icon-wrap",
        {
          scale: 1.04,
          duration: 1.0,
          ease: "sine.inOut",
          repeat: 1,
          yoyo: true,
        },
        1.8
      );

      window.__timelines["cta"] = tl;
      tl.seek(0);
    </script>
  </body>
</html>
